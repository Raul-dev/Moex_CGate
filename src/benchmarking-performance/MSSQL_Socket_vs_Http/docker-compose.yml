name: mssql-socket-http-perf

services:
  # TCP-сервис: постоянные сокеты, 4Б-запрос -> 5КБ-ответ (для SQL CLR SqlClr.Socket)
  perf-tcp:
    build:
      context: .
      dockerfile: PositionTcpService/Dockerfile
    image: perf-tcp:latest
    container_name: perf-tcp
    ports:
      - "8888:8888"
    restart: unless-stopped

  # HTTP-сервис: Kestrel аналог (для SQL CLR SqlClr.Http и сравнения по HTTP)
  perf-http:
    build:
      context: .
      dockerfile: PositionHttpService/Dockerfile
    image: perf-http:latest
    container_name: perf-http
    ports:
      - "8080:8080"
    restart: unless-stopped

# ---------------------------------------------------------------------------
